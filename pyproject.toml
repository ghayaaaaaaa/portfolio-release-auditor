[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-release-auditor"
version = "0.1.0"
description = "A privacy-preserving local pre-release scanner for small software portfolios."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
portfolio-audit = "portfolio_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

